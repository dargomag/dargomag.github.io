<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
    <style>
        body { font-family: Georgia, 'Times New Roman', serif; font-size: 18px; line-height: 1.7; color: #222; background: #fafafa; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 30px 40px; border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.05); }
        h1, h2, h3 { font-family: 'Helvetica Neue', Arial, sans-serif; color: #111; }
        h1 { font-size: 28px; margin-top: 0; }
        h2 { font-size: 22px; }
        h3 { font-size: 19px; }
        blockquote { border-left: 3px solid #ccc; margin: 20px 0; padding: 10px 20px; background: #f9f9f9; font-style: italic; }
        a { color: #336699; text-decoration: none; }
        a:hover { text-decoration: underline; }
        hr { border: none; border-top: 1px solid #ddd; margin: 30px 0; }
        img { max-width: 100%; height: auto; }
        .back-link { margin-top: 30px; display: block; }
    </style>
  <script>MathJax = { tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] }, svg: { fontCache: 'global' } };</script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
</head>
<body><div class="container">
    <a href="/" style="display:block;font-size:20px;font-weight:bold;color:#111;text-decoration:none;margin-bottom:4px">Джан дерхъаб! — За процветание всего живого!</a>
    {{ content }}
    <div style="margin-top:30px; display:flex; justify-content:space-between;">
        <a href="javascript:history.back()" style="color:#336699;text-decoration:none;">← Назад</a>
    </div>
    </div></body></html>
