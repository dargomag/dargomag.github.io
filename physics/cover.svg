<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;max-width:600px;display:block;margin:0 auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#1b2838"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
    <linearGradient id="sphere" x1="0" y1="0" x2="0.4" y2="0.6">
      <stop offset="0%" stop-color="#2a4a6a"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Фон -->
  <rect x="0" y="0" width="600" height="800" fill="url(#bg)" rx="12"/>

  <!-- Рамка -->
  <rect x="15" y="15" width="570" height="770" fill="none" stroke="url(#gold)" stroke-width="2" rx="8"/>
  <rect x="22" y="22" width="556" height="756" fill="none" stroke="url(#gold)" stroke-width="0.5" rx="6"/>

  <!-- Верхняя линия -->
  <line x1="60" y1="60" x2="540" y2="60" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>

  <!-- Девиз -->
  <text x="300" y="95" font-family="Georgia,serif" font-size="13" fill="#b8a060" text-anchor="middle" letter-spacing="3">% D Z H A N   D E R K H Y A B</text>
  <text x="300" y="115" font-family="Georgia,serif" font-size="10" fill="#8a7a40" text-anchor="middle" letter-spacing="2">ЗА ПРОЦВЕТАНИЕ ВСЕГО ЖИВОГО</text>

  <!-- Центральная сфера (космос/Вселенная) -->
  <circle cx="300" cy="300" r="110" fill="url(#sphere)" stroke="url(#gold)" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Орбиты -->
  <ellipse cx="300" cy="300" rx="95" ry="35" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.3" transform="rotate(-15,300,300)"/>
  <ellipse cx="300" cy="300" rx="80" ry="25" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.3" transform="rotate(25,300,300)"/>
  <ellipse cx="300" cy="300" rx="65" ry="20" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.3" transform="rotate(-40,300,300)"/>

  <!-- Звёзды -->
  <circle cx="240" cy="240" r="2" fill="#f0d060" opacity="0.8"/>
  <circle cx="360" cy="350" r="1.5" fill="#f0d060" opacity="0.6"/>
  <circle cx="270" cy="370" r="1.5" fill="#f0d060" opacity="0.7"/>
  <circle cx="340" cy="230" r="1" fill="#f0d060" opacity="0.5"/>
  <circle cx="220" cy="310" r="1" fill="#f0d060" opacity="0.6"/>
  <circle cx="380" cy="280" r="1.5" fill="#f0d060" opacity="0.5"/>

  <!-- Название -->
  <text x="300" y="470" font-family="'Helvetica Neue',Arial,sans-serif" font-size="64" fill="url(#gold)" text-anchor="middle" font-weight="bold" letter-spacing="8">ФИЗИКА</text>

  <!-- Подзаголовок -->
  <text x="300" y="508" font-family="Georgia,serif" font-size="16" fill="#8a8a8a" text-anchor="middle" letter-spacing="4">10 КЛАСС</text>

  <!-- Нижняя линия -->
  <line x1="150" y1="530" x2="450" y2="530" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Автор -->
  <text x="300" y="560" font-family="Georgia,serif" font-size="14" fill="#b8a060" text-anchor="middle" letter-spacing="2">НА ОСНОВЕ КУРСА Г. Я. МЯКИШЕВА</text>

  <!-- Парадигма -->
  <text x="300" y="600" font-family="Georgia,serif" font-size="12" fill="#6a7a8a" text-anchor="middle" font-style="italic">Парадигма Дарго</text>

  <!-- Нижние элементы -->
  <line x1="60" y1="730" x2="540" y2="730" stroke="url(#gold)" stroke-width="0.5" opacity="0.4"/>

  <text x="300" y="755" font-family="Georgia,serif" font-size="10" fill="#5a5a5a" text-anchor="middle" letter-spacing="2">ДЖАН ДЕРХЪЯБ — ЗА ПРОЦВЕТАНИЕ ВСЕГО ЖИВОГО</text>
</svg>